<svg width="240" height="70" viewBox="0 0 240 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="triangleGrad" x1="165" y1="10" x2="225" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E49C7A" />
      <stop offset="60%" stopColor="#D97241" />
      <stop offset="100%" stopColor="#C75F2F" />
    </linearGradient>
    <filter id="glow" x="150" y="5" width="85" height="65" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#D97241" floodOpacity="0.25" />
    </filter>
  </defs>

  <!-- Inverted Triangle -->
  <polygon points="172,14 224,14 198,60" stroke="url(#triangleGrad)" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Barbell Shaft -->
  <line x1="164" y1="30" x2="232" y2="30" stroke="#1F2722" stroke-width="5" stroke-linecap="round"/>

  <!-- Barbell Plates Right -->
  <rect x="221" y="21" width="3.5" height="18" rx="1.5" fill="#7D9683"/>
  <rect x="226" y="17" width="4.5" height="26" rx="2" fill="#1F2722"/>

  <!-- Barbell Plates Left -->
  <rect x="171" y="21" width="3.5" height="18" rx="1.5" fill="#7D9683"/>
  <rect x="165" y="17" width="4.5" height="26" rx="2" fill="#1F2722"/>

  <!-- Center Dot -->
  <circle cx="198" cy="30" r="2.5" fill="#D97241"/>

  <!-- Arabic Text: عزم -->
  <text x="145" y="42" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#1F2722" text-anchor="end">عَـزْم</text>

  <!-- English Tag: AZM -->
  <rect x="20" y="22" width="46" height="20" rx="5" fill="#FDF6F2" stroke="#F5DACB" stroke-width="1"/>
  <text x="43" y="36" font-family="monospace, sans-serif" font-weight="900" font-size="12" fill="#D97241" text-anchor="middle" letter-spacing="1.5">AZM</text>

  <!-- Subtitle -->
  <text x="145" y="58" font-family="'Cairo', sans-serif" font-weight="600" font-size="10.5" fill="#7D9683" text-anchor="end">منصة اللياقة والتغذية الصحية</text>
</svg>

