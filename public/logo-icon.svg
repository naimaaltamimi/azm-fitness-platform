  <!-- Inner White Dynamic Chevron / Kinetic Motion -->
  <path d="M50 18 L76 33 C76 56 64 74 50 84 C36 74 24 56 24 33 L50 18 Z" 
        fill="#0F172A" />

  <!-- Dynamic 'A' for AZM & Dumbbell / Falcon Motion -->
