  <!-- Right Wing / Dynamic Forward Surge -->
  <path d="M66 68 L52 28 L46 28 L60 68 Z" fill="#93C5FD" opacity="0.9" />
  
  <!-- Central Lightning / Energy Peak (Green Accent for Vitality & Nutrition) -->
  <path d="M50 24 L56 42 L46 42 L52 64 L38 46 L47 46 Z" 
        fill="url(#azmGreenGrad)" />
        
  <!-- Base Core Dot -->
